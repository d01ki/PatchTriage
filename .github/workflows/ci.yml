name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the comment); Dependabot
# (.github/dependabot.yml) proposes updates.
jobs:
  gui-state:
    name: GUI job recovery and queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --test tests/webapp_state.test.cjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests -q -m "not network"

  windows:
    name: test (Windows, PowerShell)
    # The README's primary path is Windows PowerShell; path, line-ending and
    # remediation behaviour differ there.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests -q -m "not network"
      - name: Version flag
        run: patchtriage --version
      - name: Offline demo
        run: |
          patchtriage demo --html demo_report.html --output demo_report.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path demo_report.html)) { exit 1 }

  network:
    name: live provider checks (non-blocking)
    runs-on: ubuntu-latest
    # Live OSV/KEV/EPSS/vendor lookups depend on third-party latency, so a
    # timeout here is reported without failing the required checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Network tests
        run: python -m pytest tests -q -m network

  demo:
    name: offline demo (no network, no keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run demo end-to-end
        run: |
          patchtriage demo --html demo_report.html --output demo_report.json
          test -s demo_report.html
          python -c "import json; r=json.load(open('demo_report.json')); assert r['findings'] and r['actions'] and r['evaluation']"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-report
          path: |
            demo_report.html
            demo_report.json

  verification:
    name: reviewer verification (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Verify SSVC and reproducibility
        run: patchtriage verify --repeats 100 --output verification_report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewer-verification
          path: verification_report.json

  docker:
    name: docker compose demo (as the runner's uid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image
        run: docker compose build demo
      # The runner's uid is not 1000, like many Linux hosts. The README
      # command must write ./out as that user, with no chmod or variables.
      - name: Run the README demo command
        run: |
          docker compose run --rm demo
          test -s out/demo_report.html
          test "$(stat -c %u out/demo_report.html)" = "$(id -u)"
      - name: Run through run.sh
        run: |
          rm -f out/demo_report.*
          ./run.sh demo
          test -s out/demo_report.html
